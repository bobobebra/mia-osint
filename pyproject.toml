[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mia-osint"
version = "4.2.0a10"
description = "MIA Core with Discover and Workbench local OSINT interfaces"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = "MIT"
authors = [{name = "MIA contributors"}]
maintainers = [{name = "MIA contributors"}]
keywords = ["osint", "investigation", "account-discovery", "evidence-graph", "maigret", "sherlock", "spiderfoot", "holehe", "local-first", "package-manager"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Information Technology",
  "Operating System :: Microsoft :: Windows :: Windows 10",
  "Operating System :: Microsoft :: Windows :: Windows 11",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Security",
  "Typing :: Typed",
]

dependencies = [
  "typer>=0.12,<1",
  "rich>=13,<16",
  "Jinja2>=3.1,<4",
  "pydantic>=2.7,<3",
  "PyYAML>=6,<7",
  "uv>=0.6,<1",
  "keyring>=25,<27",
  "packaging>=24,<27",
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.34,<1",
  "python-multipart>=0.0.20,<1",
]

[project.urls]
Documentation = "https://github.com/bobobebra/mia-osint/tree/main/docs"
Issues = "https://github.com/bobobebra/mia-osint/issues"
Source = "https://github.com/bobobebra/mia-osint"

[project.optional-dependencies]
vision = [
  "Pillow>=10,<13",
]
dev = [
  "pytest>=8,<10",
  "pytest-cov>=5,<8",
  "pytest-asyncio>=0.24,<2",
  "ruff>=0.8,<1",
  "mypy>=1.13,<3",
  "build>=1.2,<2",
  "twine>=5,<8",
  "httpx>=0.27,<1",
]

[project.scripts]
mia = "mia.cli:main"

[project.entry-points."mia.plugins"]
# Third-party packages can register plugins in this group.

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
mia = ["py.typed", "templates/*.j2", "data/*.yaml", "web/static_workbench/*", "web/static_workbench/assets/*", "web/static_discover/*", "web/static_discover/assets/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["src", "."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
check_untyped_defs = true
no_implicit_optional = true
