[package]
name = "mia-desktop"
version = "4.2.0-alpha.10"
description = "Windows desktop shell for MIA Discover and MIA Workbench"
authors = ["MIA contributors"]
edition = "2021"

[lib]
name = "mia_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
tokio = { version = "1", features = ["time"] }
