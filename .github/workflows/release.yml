name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  portable:
    name: Build Python and Linux assets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            frontend-discover/package-lock.json
            frontend-workbench/package-lock.json
      - name: Verify tag matches the package version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          expected_tag="$(python - <<'PY'
          import re
          import tomllib
          from pathlib import Path

          version = tomllib.loads(Path('pyproject.toml').read_text(encoding='utf-8'))['project']['version']
          print('v' + re.sub(r'a(\d+)$', r'-alpha.\1', version))
          PY
          )"
          test "$TAG" = "$expected_tag" || {
            echo "Tag $TAG does not match package version ($expected_tag)." >&2
            exit 1
          }
      - name: Build interfaces
        run: |
          npm --prefix frontend-workbench ci --no-audit --no-fund
          npm --prefix frontend-workbench run build
          npm --prefix frontend-discover ci --no-audit --no-fund
          npm --prefix frontend-discover run build
      - name: Build Python distributions
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
          python -m twine check dist/*
      - name: Build Linux and source installers
        env:
          TAG: ${{ github.ref_name }}
        run: |
          bash scripts/build_linux_installer.sh dist/MIA-Linux-Installer.run
          cp install-mia.sh dist/install-mia.sh
          git archive --format=zip --prefix="mia-osint-${TAG#v}/" -o "dist/MIA-${TAG}.zip" HEAD
      - uses: actions/upload-artifact@v7
        with:
          name: release-portable-${{ github.ref_name }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14

  windows:
    name: Build and install-test Windows x64
    runs-on: windows-2025
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            frontend-discover/package-lock.json
            frontend-workbench/package-lock.json
            desktop/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri
      - name: Build, sidecar-test, and install-test Windows setup
        shell: pwsh
        run: ./packaging/windows/build-desktop.ps1
      - uses: actions/upload-artifact@v7
        with:
          name: release-windows-${{ github.ref_name }}
          path: dist/windows/*
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish complete prerelease
    needs: [portable, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@v8
        with:
          pattern: release-*-${{ github.ref_name }}
          path: dist
          merge-multiple: true
      - name: Verify the complete release set
        env:
          TAG: ${{ github.ref_name }}
        run: |
          package_version="$(python - <<'PY'
          import tomllib
          from pathlib import Path

          print(tomllib.loads(Path('pyproject.toml').read_text(encoding='utf-8'))['project']['version'])
          PY
          )"
          display_version="${TAG#v}"
          expected=(
            "MIA-Linux-Installer.run"
            "install-mia.sh"
            "MIA-${TAG}.zip"
            "mia_osint-${package_version}-py3-none-any.whl"
            "mia_osint-${package_version}.tar.gz"
            "MIA-${display_version}-Windows-x64-Setup.exe"
            "MIA-${display_version}-Windows-x64-SHA256.txt"
          )
          for asset in "${expected[@]}"; do
            test -s "dist/$asset" || {
              echo "Missing or empty release asset: $asset" >&2
              exit 1
            }
          done
          (
            cd dist
            sha256sum --check "MIA-${display_version}-Windows-x64-SHA256.txt"
            find . -maxdepth 1 -type f ! -name SHA256SUMS.txt -printf '%f\0' \
              | sort -z \
              | xargs -0 sha256sum > SHA256SUMS.txt
            sha256sum --check SHA256SUMS.txt
          )
      - name: Create or refresh GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
            gh release edit "$TAG" \
              --prerelease \
              --notes-file RELEASE_NOTES.md \
              --title "MIA $TAG"
          else
            gh release create "$TAG" dist/* \
              --verify-tag \
              --prerelease \
              --notes-file RELEASE_NOTES.md \
              --title "MIA $TAG"
          fi
