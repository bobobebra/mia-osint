name: Publish reviewed MIA source

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  validate-and-publish:
    if: github.event_name == 'pull_request' || github.event.head_commit.message == 'Stage reviewed MIA public release'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Reassemble reviewed source
        shell: bash
        run: |
          set -euo pipefail
          cat .mia-import/chunk-* > /tmp/mia-source.tar.gz
          echo 'ed441b7a32b2edc6f610cb84c8389462581424b8ed4b26fdef3e5d56715e362e  /tmp/mia-source.tar.gz' | sha256sum --check
          mkdir -p /tmp/mia-public
          tar -xzf /tmp/mia-source.tar.gz -C /tmp/mia-public
          test -f /tmp/mia-public/mia-source/README.md
          test -f /tmp/mia-public/mia-source/pyproject.toml
          test -d /tmp/mia-public/mia-source/src
          test -d /tmp/mia-public/mia-source/frontend-discover
          test -d /tmp/mia-public/mia-source/frontend-workbench


          python - <<'PY'
          from pathlib import Path

          patches = {
              "tests/conftest.py": [
                  (
                      "import pytest\n",
                      "import pytest\nfrom typer import rich_utils\n",
                  ),
                  (
                      "@pytest.fixture\ndef app_config",
                      "@pytest.fixture(autouse=True)\ndef stable_cli_width(monkeypatch: pytest.MonkeyPatch) -> None:\n    monkeypatch.setattr(rich_utils, \"MAX_WIDTH\", 160)\n\n\n@pytest.fixture\ndef app_config",
                  ),
              ],
              "tests/test_assistant_providers.py": [
                  (
                      "import pytest\nfrom typer.testing import CliRunner",
                      "import pytest\nfrom click import unstyle\nfrom typer.testing import CliRunner",
                  ),
                  (
                      'assert "--model" in result.stdout',
                      'assert "--model" in unstyle(result.stdout)',
                  ),
                  (
                      'runner.invoke(app, ["case", "summarize", "--help"])',
                      'runner.invoke(app, ["case", "summarize", "--help"], env={"COLUMNS": "160"})',
                  ),
              ],
              "tests/test_cli.py": [
                  (
                      "from typer.testing import CliRunner",
                      "from click import unstyle\nfrom typer.testing import CliRunner",
                  ),
                  (
                      'assert "--quiet" in result.stdout',
                      'assert "--quiet" in unstyle(result.stdout)',
                  ),
                  (
                      'runner.invoke(app, ["pkg", command, "--help"])',
                      'runner.invoke(app, ["pkg", command, "--help"], env={"COLUMNS": "160"})',
                  ),
              ],
              "tests/test_web_ui.py": [
                  (
                      "import yaml\nfrom fastapi.testclient import TestClient",
                      "import yaml\nfrom click import unstyle\nfrom fastapi.testclient import TestClient",
                  ),
                  (
                      'assert "--no-browser" in workbench.stdout',
                      'assert "--no-browser" in unstyle(workbench.stdout)',
                  ),
                  (
                      'assert "--no-browser" in discover.stdout',
                      'assert "--no-browser" in unstyle(discover.stdout)',
                  ),
                  (
                      'assert "requires --token" in (result.stdout + getattr(result, "stderr", ""))',
                      'assert "requires --token" in unstyle(result.stdout + getattr(result, "stderr", ""))',
                  ),
                  (
                      'runner.invoke(cli_app, ["workbench", "--help"])',
                      'runner.invoke(cli_app, ["workbench", "--help"], env={"COLUMNS": "160"})',
                  ),
                  (
                      'runner.invoke(cli_app, ["discover", "--help"])',
                      'runner.invoke(cli_app, ["discover", "--help"], env={"COLUMNS": "160"})',
                  ),
                  (
                      'runner.invoke(cli_app, ["ui", "--help"])',
                      'runner.invoke(cli_app, ["ui", "--help"], env={"COLUMNS": "160"})',
                  ),
                  (
                      'runner.invoke(cli_app, ["workbench", "ui", "--help"])',
                      'runner.invoke(cli_app, ["workbench", "ui", "--help"], env={"COLUMNS": "160"})',
                  ),
                  (
                      'CliRunner().invoke(cli_app, ["workbench", "--allow-remote", "--no-browser"])',
                      'CliRunner().invoke(cli_app, ["workbench", "--allow-remote", "--no-browser"], env={"COLUMNS": "160"})',
                  ),
              ],
          }
          root = Path("/tmp/mia-public/mia-source")
          for relative, replacements in patches.items():
              path = root / relative
              text = path.read_text(encoding="utf-8")
              for old, new in replacements:
                  if old not in text:
                      raise SystemExit(f"expected release patch target missing: {relative}: {old}")
                  text = text.replace(old, new, 1)
              path.write_text(text, encoding="utf-8")
          PY

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate Python core
        working-directory: /tmp/mia-public/mia-source
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'
          ruff format tests/test_assistant_providers.py tests/test_cli.py tests/test_web_ui.py
          ruff check .
          ruff format --check .
          pytest
          python -m compileall -q src tests scripts

      - name: Validate interfaces
        working-directory: /tmp/mia-public/mia-source
        run: |
          npm --prefix frontend-discover ci
          npm --prefix frontend-discover run build
          npm --prefix frontend-discover run lint
          npm --prefix frontend-workbench ci
          npm --prefix frontend-workbench run build
          npm --prefix frontend-workbench run lint

      - name: Validate packaging and installers
        working-directory: /tmp/mia-public/mia-source
        run: |
          python -m build
          python -m twine check dist/*
          bash -n install.sh uninstall.sh install-mia.sh scripts/build_linux_installer.sh

      - name: Publish clean source history
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        working-directory: /tmp/mia-public/mia-source
        shell: bash
        run: |
          set -euo pipefail
          git init -b main
          git config user.name 'bobobebra'
          git config user.email '149588933+bobobebra@users.noreply.github.com'
          git add -A
          git commit -m 'Publish MIA 4.2.0 Alpha 9'
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${REPOSITORY}.git"
          git push --force origin main
