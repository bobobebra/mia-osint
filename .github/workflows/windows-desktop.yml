name: Windows desktop

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'frontend-discover/**'
      - 'frontend-workbench/**'
      - 'desktop/**'
      - 'packaging/windows/**'
      - 'pyproject.toml'
      - '.github/workflows/windows-desktop.yml'
permissions:
  contents: read

jobs:
  build-windows-x64:
    runs-on: windows-2025
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            frontend-discover/package-lock.json
            frontend-workbench/package-lock.json
            desktop/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri
      - name: Build and smoke-test Windows installer
        shell: pwsh
        run: ./packaging/windows/build-desktop.ps1
      - uses: actions/upload-artifact@v7
        with:
          name: mia-windows-x64-unsigned-${{ github.sha }}
          path: dist/windows/*
          if-no-files-found: error
