name: Windows desktop

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'frontend-discover/**'
      - 'frontend-workbench/**'
      - 'desktop/**'
      - 'packaging/windows/**'
      - 'pyproject.toml'
      - '.github/workflows/windows-desktop.yml'
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-windows-x64:
    runs-on: windows-2025
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            frontend-discover/package-lock.json
            frontend-workbench/package-lock.json
            desktop/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri
      - name: Build and smoke-test Windows installer
        shell: pwsh
        run: ./packaging/windows/build-desktop.ps1
      - uses: actions/upload-artifact@v7
        with:
          name: mia-4.2.0-alpha.9-windows-x64-unsigned
          path: dist/windows/*
          if-no-files-found: error
      - name: Attach installer to tagged pre-release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$env:GITHUB_REF_NAME" *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create "$env:GITHUB_REF_NAME" --prerelease --generate-notes --title "MIA $env:GITHUB_REF_NAME"
          }
          gh release upload "$env:GITHUB_REF_NAME" dist/windows/* --clobber
