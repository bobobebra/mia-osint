name: Complete private MIA import

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import:
    if: github.event_name == 'workflow_dispatch' || github.event.head_commit.message == 'Stage private MIA source import'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Download encrypted verified source
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 8 --retry-delay 3 \
            'https://mia-osint-892397-20260712.serveo.net/mia-source.enc' \
            --output /tmp/mia-source.enc

      - name: Decrypt and inspect source
        shell: bash
        run: |
          set -euo pipefail
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 \
            -in /tmp/mia-source.enc \
            -out /tmp/mia-source.tar.xz \
            -pass pass:'MIA-4.2.0-alpha3-9yX7pQ2vK8mR5sT1'
          mkdir -p /tmp/mia-source
          tar -xJf /tmp/mia-source.tar.xz -C /tmp/mia-source
          test -f /tmp/mia-source/README.md
          test -f /tmp/mia-source/pyproject.toml
          test -d /tmp/mia-source/src
          test -d /tmp/mia-source/frontend

      - name: Build frontend assets
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: /tmp/mia-source/frontend/package-lock.json

      - name: Compile frontend
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/mia-source/frontend
          npm ci
          npm run build
          rm -rf node_modules

      - name: Publish clean repository history
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/mia-source
          rm -rf .git .mia-import
          rm -f .github/workflows/mia-import.yml
          git init -b main
          git config user.name 'bobobebra'
          git config user.email '149588933+bobobebra@users.noreply.github.com'
          git add -A
          git commit -m 'Import MIA v4.2.0 Alpha 3'
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${REPOSITORY}.git"
          git push --force origin main
