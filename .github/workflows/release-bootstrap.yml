name: Publish MIA 4.2.0 alpha 9

on:
  push:
    branches:
      - release/v4.2.0-alpha.9

permissions:
  contents: write

env:
  RELEASE_TAG: v4.2.0-alpha.9

jobs:
  linux-assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            frontend-discover/package-lock.json
            frontend-workbench/package-lock.json
      - name: Build interfaces
        run: |
          npm --prefix frontend-workbench ci --no-audit --no-fund
          npm --prefix frontend-workbench run build
          npm --prefix frontend-discover ci --no-audit --no-fund
          npm --prefix frontend-discover run build
      - name: Build and validate Python distributions
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
          python -m twine check dist/*
      - name: Build Linux installer and source archive
        run: |
          bash scripts/build_linux_installer.sh dist/MIA-Linux-Installer.run
          cp install-mia.sh dist/install-mia.sh
          git archive --format=zip --prefix="mia-${RELEASE_TAG}/" -o "dist/MIA-${RELEASE_TAG}.zip" HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: linux-and-source-assets
          path: dist/*
          if-no-files-found: error

  windows-assets:
    runs-on: windows-2025
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            frontend-discover/package-lock.json
            frontend-workbench/package-lock.json
            desktop/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri
      - name: Build and smoke-test Windows installer
        shell: pwsh
        run: ./packaging/windows/build-desktop.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: windows-assets
          path: dist/windows/*
          if-no-files-found: error

  publish:
    needs:
      - linux-assets
      - windows-assets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: '*-assets'
          path: dist
          merge-multiple: true
      - name: Generate checksums
        run: |
          cd dist
          find . -maxdepth 1 -type f ! -name SHA256SUMS.txt -printf '%f\n' | sort | xargs sha256sum > SHA256SUMS.txt
      - name: Publish GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ github.sha }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release edit "$RELEASE_TAG" \
              --prerelease \
              --notes-file RELEASE_NOTES.md \
              --title "MIA $RELEASE_TAG"
          else
            gh release create "$RELEASE_TAG" \
              --target "$TARGET_SHA" \
              --prerelease \
              --notes-file RELEASE_NOTES.md \
              --title "MIA $RELEASE_TAG"
          fi
          gh release upload "$RELEASE_TAG" dist/* --clobber
